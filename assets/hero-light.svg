<svg xmlns="http://www.w3.org/2000/svg" width="820" height="468" viewBox="0 0 820 468" role="img" aria-labelledby="t d">
<title id="t">Green before the fix, green after it</title>
<desc id="d">Terminal: WISE-API builds successfully both before and after the PR #325 run-ownership fix, because the controller&#x27;s test is excluded from the build. Which checks are actually protecting anything?</desc>
<style>
text{font:14px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}
.p{fill:#0969da} .t{fill:#1f2328} .d{fill:#59636e} .ok{fill:#1a7f37;font-weight:700}
.bad{fill:#cf222e} .m{fill:#8250df} .a{fill:#9a6700} .q{fill:#1f2328;font-weight:700}
.title{fill:#59636e;font-size:12px}
.cover{fill:#ffffff} .cursor{fill:#0969da;animation:blink 1.1s step-end infinite}
.o{animation:show .01s both}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{fill-opacity:0}}
@keyframes type0{to{transform:translateX(120.4px)}}
@keyframes type3{to{transform:translateX(361.2px)}}
@keyframes type11{to{transform:translateX(326.8px)}}
@keyframes type13{to{transform:translateX(120.4px)}}
@media (prefers-reduced-motion:reduce){.o,.cursor{animation:none!important}.cover{display:none}}
</style>
<rect x=".5" y=".5" width="819" height="467" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<path d="M.5 10.5a10 10 0 0 1 10-10h799a10 10 0 0 1 10 10v26h-819z" fill="#f6f8fa"/>
<line x1=".5" y1="36.5" x2="819.5" y2="36.5" stroke="#d0d7de"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="410.0" y="22" text-anchor="middle" class="title">~/WISE-API   (upstream, UC Berkeley)</text>
<clipPath id="c"><rect x="1" y="37" width="818" height="430"/></clipPath>
<g clip-path="url(#c)">
<text x="24" y="66" class="o" style="animation-delay:0.60s"><tspan class="p">$ </tspan><tspan class="t">./mvnw package</tspan></text>
<rect class="cover" x="41.2" y="52" width="820" height="22" style="animation:type0 0.49s steps(14) 0.80s both"/>
<text x="24" y="88" class="o" style="animation-delay:1.74s"><tspan class="ok">  BUILD SUCCESS</tspan></text>
<text x="24" y="132" class="o" style="animation-delay:2.01s"><tspan class="p">$ </tspan><tspan class="t">grep -n BatchStudentChangePassword pom.xml</tspan></text>
<rect class="cover" x="41.2" y="118" width="820" height="22" style="animation:type3 1.47s steps(42) 2.21s both"/>
<text x="24" y="154" class="o" style="animation-delay:4.13s"><tspan class="d">  159:  </tspan><tspan class="bad">&lt;exclude&gt;**/…/BatchStudentChangePasswordControllerTest.java&lt;/exclude&gt;</tspan></text>
<text x="24" y="176" class="o" style="animation-delay:4.25s"><tspan class="d">  208:  </tspan><tspan class="bad">&lt;exclude&gt;**/…/BatchStudentChangePasswordControllerTest.java&lt;/exclude&gt;</tspan></text>
<text x="24" y="198" class="o" style="animation-delay:4.37s"><tspan class="d">  # this controller&#x27;s test is never compiled or run</tspan></text>
<text x="24" y="242" class="o" style="animation-delay:4.64s"><tspan class="bad"># meanwhile, a teacher could batch-reset passwords</tspan></text>
<text x="24" y="264" class="o" style="animation-delay:4.76s"><tspan class="bad"># for a group in a run they did not own</tspan></text>
<text x="24" y="308" class="o" style="animation-delay:5.03s"><tspan class="p">$ </tspan><tspan class="t">git apply re-check-run-ownership.patch</tspan></text>
<rect class="cover" x="41.2" y="294" width="820" height="22" style="animation:type11 1.33s steps(38) 5.23s both"/>
<text x="24" y="330" class="o" style="animation-delay:7.01s"><tspan class="m">  # PR #325, merged upstream</tspan></text>
<text x="24" y="352" class="o" style="animation-delay:7.13s"><tspan class="p">$ </tspan><tspan class="t">./mvnw package</tspan></text>
<rect class="cover" x="41.2" y="338" width="820" height="22" style="animation:type13 0.49s steps(14) 7.33s both"/>
<text x="24" y="374" class="o" style="animation-delay:8.27s"><tspan class="ok">  BUILD SUCCESS</tspan></text>
<text x="24" y="418" class="o" style="animation-delay:8.54s"><tspan class="a"># green before the fix. green after it.</tspan></text>
<text x="24" y="440" class="o" style="animation-delay:8.66s"><tspan class="q"># which checks are actually protecting anything?</tspan> <tspan class="cursor" style="animation-delay:8.66s">█</tspan></text>
</g>
</svg>
