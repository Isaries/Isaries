name: Profile Summary Cards

on:
  schedule:
    # The upstream example's "* */24 * * *" fires every minute of hour 0.
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Read-only PAT so private contributions are counted; the push itself
          # uses the workflow token persisted by actions/checkout.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 8
          THEME: github_dark
